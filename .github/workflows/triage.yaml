name: triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const { title, body } = context.payload.issue;
            const lowerTitle = (title ?? '').toLowerCase();
            const lowerBody  = (body  ?? '').toLowerCase();

            const RULES = [
              { name: 'bug',         color: 'd73a4a', description: "Something isn't working",
                keywords: ['bug', 'broken', 'crash', 'no funciona', 'falla', 'se rompe', "doesn't work", "won't load", "doesn't load"] },
              { name: 'enhancement', color: 'a2eeef', description: 'New feature or request',
                keywords: ['feature', 'request', 'idea', 'mejora', 'agregar', 'implementar', 'soportar', 'añadir', 'nuevo'] },
              { name: 'docs',        color: '0075ca', description: 'Improvements or additions to documentation',
                keywords: ['docs', 'readme', 'typo', 'documentación', 'documentacion', 'comment', 'manual'] },
            ];
            const FALLBACK = { name: 'needs-triage', color: 'ededed', description: 'Unclassified — needs human triage' };

            const detected = new Set();
            for (const rule of RULES) {
              if (rule.keywords.some(k => lowerTitle.includes(k) || lowerBody.includes(k))) {
                detected.add(rule.name);
              }
            }
            if (
              lowerTitle.includes('?') || lowerBody.includes('?') ||
              /^(how|c[oó]mo|why|por qu[eé])\b/.test(lowerTitle)
            ) {
              detected.add('question');
            }

            const labels = detected.size ? [...detected] : [FALLBACK.name];

            for (const name of labels) {
              const def = RULES.find(r => r.name === name) ?? FALLBACK;
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, ...def });
                } else {
                  throw e;
                }
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels });

            const CHECKLISTS = {
              bug: [
                '**Entorno:** navegador, SO, versión de la página',
                '**Pasos para reproducir** (numerados, mínimos)',
                '**Resultado esperado**',
                '**Resultado actual** (con mensaje de error si lo hay)',
              ],
              enhancement: [
                '**Motivación / caso de uso:** ¿qué problema resuelve?',
                '**Alternativas consideradas** (si aplica)',
                '**Comportamiento deseado** — qué debería pasar',
              ],
              docs: [
                '**Archivo o sección afectada** (ruta o enlace)',
                '**Qué cambiar exactamente** — propuesta de texto',
              ],
              question: [
                '**Qué se intentó ya** para resolverlo',
                '**Reformula la pregunta** de la forma más concreta posible',
              ],
              'needs-triage': [
                '**Categoría probable:** ¿bug, mejora, docs o pregunta?',
                '**Pasos dados hasta ahora** y resultados',
              ],
            };

            const category = labels[0];
            const items = (CHECKLISTS[category] ?? CHECKLISTS['needs-triage'])
              .map(i => `- [ ] ${i}`).join('\n');

            const comment = [
              '### :robot: Triage automático',
              '',
              `**Etiquetas aplicadas:** ${labels.map(l => `\`${l}\``).join(', ')}`,
              `**Categoría detectada:** \`${category}\``,
              '',
              'Para ayudar a la revisión, por favor completa la siguiente lista:',
              '',
              items,
              '',
              '_Este comentario lo generó automáticamente el bot de triage; ajústalo según tu caso. El contenido original del issue **no fue modificado**._',
            ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: number, body: comment });